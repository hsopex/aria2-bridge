<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Aria2 Bridge</title><script src="../theme.js"></script><link rel="stylesheet" href="../styles.css"><script src="popup.js" defer></script></head>
<body class="popup"><main>
<h1>Aria2 Bridge</h1>
<label>默认 RPC <select id="server"></select></label>
<label class="toggle"><input id="enabled" type="checkbox"> 自动接管下载</label>
<button id="test" type="button" class="secondary">测试连接</button>
<p id="tasks" aria-live="polite">正在查询任务数量…</p>
<p id="status" role="status">正在连接…</p><p id="pending"></p>
<form id="links"><label>添加链接／磁力链接（每行一个）<textarea id="urls" rows="4" required placeholder="https://example.org/file.zip"></textarea></label><button id="add" type="submit">发送到 aria2</button></form>
<nav><button id="manager" type="button">打开 AriaNg</button><button id="sidebar" type="button" class="secondary">侧栏</button><button id="options" type="button" class="secondary">设置与交接记录</button></nav>
</main></body></html>
